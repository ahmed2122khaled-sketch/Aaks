name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mr.x APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. Accept Android SDK licenses
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true


      # ============================================================
      # 5. Install Android SDK required by Mr.x
      #
      # Project configuration:
      # compileSdk = 37
      # targetSdk  = 37
      #
      # AGP 9.3.2 uses Build Tools 36.0.0 by default.
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"


      # ============================================================
      # 6. Verify repository structure
      # ============================================================
      - name: Verify Mr.x project structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Mr.x Android Project Verification"
          echo "========================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -la

          echo ""
          echo "Checking required files..."

          test -f "./settings.gradle.kts" || {
            echo "::error::settings.gradle.kts was not found."
            exit 1
          }

          test -f "./build.gradle.kts" || {
            echo "::error::Root build.gradle.kts was not found."
            exit 1
          }

          test -f "./app/build.gradle.kts" || {
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          }

          test -f "./app/src/main/AndroidManifest.xml" || {
            echo "::error::AndroidManifest.xml was not found."
            exit 1
          }

          test -f "./gradle/wrapper/gradle-wrapper.properties" || {
            echo "::error::Gradle wrapper properties were not found."
            exit 1
          }

          test -f "./gradlew" || {
            echo "::error::gradlew was not found."
            exit 1
          }

          echo ""
          echo "All required project files are present."


      # ============================================================
      # 7. Verify Kotlin-only source tree
      # ============================================================
      - name: Verify Kotlin-only source
        shell: bash
        run: |
          set -e

          echo "Checking for Java source files..."

          JAVA_FILES=$(find app/src -type f -name "*.java" -print)

          if [ -n "$JAVA_FILES" ]; then
            echo "::error::Java files were found in app/src:"
            echo "$JAVA_FILES"
            exit 1
          fi

          KOTLIN_COUNT=$(find app/src -type f -name "*.kt" | wc -l)

          echo "Java source files: 0"
          echo "Kotlin source files: $KOTLIN_COUNT"

          if [ "$KOTLIN_COUNT" -eq 0 ]; then
            echo "::error::No Kotlin source files were found."
            exit 1
          fi


      # ============================================================
      # 8. Verify Gradle configuration
      # ============================================================
      - name: Verify Mr.x Gradle configuration
        shell: bash
        run: |
          set -e

          echo "Checking Gradle configuration..."

          echo ""
          echo "Gradle wrapper:"
          grep "distributionUrl=" \
            gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Android Gradle Plugin:"
          grep 'com.android.application' build.gradle.kts

          echo ""
          echo "Android SDK configuration:"
          grep -E \
            'compileSdk|minSdk|targetSdk|applicationId|versionCode|versionName' \
            app/build.gradle.kts || true


      # ============================================================
      # 9. Configure Supabase
      #
      # app/build.gradle.kts reads:
      #
      # SUPABASE_URL
      # SUPABASE_PUBLISHABLE_KEY
      #
      # Therefore the generated properties use those exact names.
      # ============================================================
      - name: Prepare Supabase configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          if [ -n "$SUPABASE_URL" ] || [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then

            {
              printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
              printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            } > supabase.properties

            echo "Supabase configuration prepared."

          else

            echo "Supabase GitHub Secrets are not configured."
            echo "The build will continue using empty/default values."

          fi


      # ============================================================
      # 10. Make Gradle wrapper executable
      # ============================================================
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          chmod +x ./gradlew

          echo "Gradle wrapper permissions:"
          ls -l ./gradlew


      # ============================================================
      # 11. Use pinned Gradle 9.7.1
      #
      # The repository itself is pinned to Gradle 9.7.1.
      # This also avoids relying on the broken setup-java Gradle
      # cache detection that caused the previous GitHub failure.
      # ============================================================
      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"


      # ============================================================
      # 12. Show toolchain versions
      # ============================================================
      - name: Verify Java Android and Gradle
        shell: bash
        run: |
          echo "========================================"
          echo "Java"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "Gradle"
          echo "========================================"
          gradle --version

          echo ""
          echo "========================================"
          echo "Android SDK"
          echo "========================================"
          sdkmanager --list_installed | head -100


      # ============================================================
      # 13. Clean previous build
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 14. Build Debug APK
      # ============================================================
      - name: Build Mr.x Debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 15. Run unit tests if available
      # ============================================================
      - name: Run Debug unit tests
        shell: bash
        run: |
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 16. Find generated APK
      # ============================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK files..."

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK was not generated:"
            echo "$APK"

            echo ""
            echo "Available APK files:"
            find app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo ""
          echo "APK successfully generated:"
          ls -lh "$APK"


      # ============================================================
      # 17. Rename APK
      # ============================================================
      - name: Rename APK to Mr.x.apk
        shell: bash
        run: |
          set -e

          cp \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "Mr.x.apk"

          echo "Final APK:"
          ls -lh "Mr.x.apk"


      # ============================================================
      # 18. Upload APK
      # ============================================================
      - name: Upload Mr.x APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr.x-debug-apk
          path: Mr.x.apk
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # 19. Final verification
      # ============================================================
      - name: Final build verification
        shell: bash
        run: |
          set -e

          if [ ! -s "Mr.x.apk" ]; then
            echo "::error::Mr.x.apk is missing or empty."
            exit 1
          fi

          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"
          echo "APK: Mr.x.apk"
          echo "Size:"
          ls -lh "Mr.x.apk"
