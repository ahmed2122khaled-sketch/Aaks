name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'


      # ============================================================
      # 4. Accept Android SDK licenses
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Accepting Android SDK licenses"
          echo "=========================================="

          yes | sdkmanager --licenses > /tmp/sdk-licenses.log 2>&1 || true

          echo "Android SDK licenses processed."


      # ============================================================
      # 5. Set project directory
      # ============================================================
      - name: Set Android project directory
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Android project"
          echo "=========================================="

          PROJECT_DIR="$GITHUB_WORKSPACE"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::settings.gradle.kts or settings.gradle was not found in repository root."
            echo ""
            echo "Repository contents:"
            ls -la "$PROJECT_DIR"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::app directory was not found."
            exit 1
          fi

          echo "Android project found."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 6. Validate project structure
      # ============================================================
      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Validating project structure"
          echo "=========================================="

          echo "Current directory:"
          pwd

          echo ""

          echo "Gradle files:"
          ls -lh gradlew settings.gradle* build.gradle* 2>/dev/null || true

          echo ""

          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew was not found."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::gradle-wrapper.jar was not found."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::gradle-wrapper.properties was not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Project structure OK."


      # ============================================================
      # 7. Verify Android configuration
      # ============================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Verifying Android configuration"
          echo "=========================================="

          BUILD_FILE="app/build.gradle.kts"

          echo "Build file:"
          echo "$BUILD_FILE"

          echo ""

          if grep -Eq \
            'compileSdk[[:space:]]*=[[:space:]]*37' \
            "$BUILD_FILE"; then
            echo "OK: compileSdk = 37"
          else
            echo "::error::compileSdk = 37 was not found."
            exit 1
          fi

          if grep -Eq \
            'targetSdk[[:space:]]*=[[:space:]]*37' \
            "$BUILD_FILE"; then
            echo "OK: targetSdk = 37"
          else
            echo "::error::targetSdk = 37 was not found."
            exit 1
          fi

          if grep -Eq \
            'buildConfig[[:space:]]*=[[:space:]]*true' \
            "$BUILD_FILE"; then
            echo "OK: BuildConfig enabled"
          else
            echo "WARNING: buildConfig = true was not explicitly found."
          fi

          echo ""
          echo "Android configuration OK."


      # ============================================================
      # 8. Install Android SDK components
      # ============================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Android SDK"
          echo "=========================================="

          SDKMANAGER="$(command -v sdkmanager)"

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""

          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          echo ""

          echo "=========================================="
          echo "Searching for Android API 37"
          echo "=========================================="

          SDK_LIST="$("$SDKMANAGER" --list --channel=3 2>&1 || true)"

          echo "$SDK_LIST" | grep -E \
            'platforms;android-37|platforms/android-37|build-tools;36.0.0|platform-tools' \
            || true

          echo ""

          PLATFORM_PACKAGE=""

          if echo "$SDK_LIST" | grep -Eq \
            'platforms;android-37([[:space:]]|$)'; then

            PLATFORM_PACKAGE="platforms;android-37"

          elif echo "$SDK_LIST" | grep -Eq \
            'platforms/android-37([[:space:]]|$)'; then

            PLATFORM_PACKAGE="platforms/android-37"

          fi

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "::error::Android API 37 package was not found."
            echo ""
            echo "Available android-37 entries:"
            echo "$SDK_LIST" | grep -i 'android-37' || true
            exit 1
          fi

          echo "Detected API 37 package:"
          echo "$PLATFORM_PACKAGE"

          echo ""

          echo "=========================================="
          echo "Installing SDK packages"
          echo "=========================================="

          "$SDKMANAGER" \
            --channel=3 \
            --install \
            "platform-tools" \
            "$PLATFORM_PACKAGE" \
            "build-tools;36.0.0"

          echo ""

          echo "SDK installation completed."


      # ============================================================
      # 9. Verify Android 37 SDK
      # ============================================================
      - name: Verify Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying Android 37 SDK"
          echo "=========================================="

          PLATFORM_DIR="$ANDROID_SDK_ROOT/platforms/android-37"

          echo "Checking:"
          echo "$PLATFORM_DIR"

          if [ ! -d "$PLATFORM_DIR" ]; then
            echo "::error::Android 37 platform directory was not installed."
            exit 1
          fi

          if [ ! -f "$PLATFORM_DIR/android.jar" ]; then
            echo "::error::android.jar was not found."
            exit 1
          fi

          echo ""
          echo "Android 37 SDK verified successfully."


      # ============================================================
      # 10. Verify Gradle Wrapper
      # ============================================================
      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Verifying Gradle Wrapper"
          echo "=========================================="

          chmod +x gradlew

          echo ""
          echo "Gradle distribution:"
          grep '^distributionUrl=' \
            gradle/wrapper/gradle-wrapper.properties

          echo ""

          echo "Gradle wrapper
