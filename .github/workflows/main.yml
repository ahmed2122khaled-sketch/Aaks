name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Java 17
      # ==========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================================
      # 3. Android SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'


      # ==========================================================
      # 4. Accept Android SDK licenses
      # ==========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Accepting Android SDK licenses"
          echo "=========================================="

          yes | sdkmanager --licenses > /tmp/sdk-licenses.log 2>&1 || true

          echo "Android SDK licenses processed."


      # ==========================================================
      # 5. Extract the Android project
      #
      # Repository contains:
      #
      # mrx-51-final-fixed-buildable.zip
      #
      # Inside ZIP:
      #
      # mrx/
      # ├── settings.gradle.kts
      # ├── build.gradle.kts
      # ├── gradlew
      # ├── gradle/
      # └── app/
      # ==========================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Extracting Android project"
          echo "=========================================="

          ZIP_FILE="$GITHUB_WORKSPACE/mrx-51-final-fixed-buildable.zip"
          EXTRACT_DIR="$GITHUB_WORKSPACE/extracted"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP was not found:"
            echo "$ZIP_FILE"
            exit 1
          fi

          rm -rf "$EXTRACT_DIR"

          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          PROJECT_DIR="$EXTRACT_DIR/mrx"

          echo ""
          echo "Checking project..."

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::The mrx directory was not found inside the ZIP."
            echo ""
            echo "Extracted files:"
            ls -la "$EXTRACT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::build.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::gradlew was not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/gradle/wrapper" ]; then
            echo "::error::Gradle wrapper directory was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"


      # ==========================================================
      # 6. Validate project structure
      # ==========================================================
      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Validating project structure"
          echo "=========================================="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -d app
          test -d app/src

          chmod +x gradlew

          echo ""
          echo "Project structure is valid."


      # ==========================================================
      # 7. Verify Android configuration
      # ==========================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Verifying Android configuration"
          echo "=========================================="

          BUILD_FILE="app/build.gradle.kts"

          echo ""
          echo "compileSdk:"
          grep -n "compileSdk" "$BUILD_FILE"

          echo ""
          echo "targetSdk:"
          grep -n "targetSdk" "$BUILD_FILE"

          echo ""
          echo "minSdk:"
          grep -n "minSdk" "$BUILD_FILE"

          echo ""

          if ! grep -Eq \
            'compileSdk[[:space:]]*=[[:space:]]*37' \
            "$BUILD_FILE"; then
            echo "::error::compileSdk 37 was not found."
            exit 1
          fi

          if ! grep -Eq \
            'targetSdk[[:space:]]*=[[:space:]]*37' \
            "$BUILD_FILE"; then
            echo "::error::targetSdk 37 was not found."
            exit 1
          fi

          echo "Android configuration is valid."


      # ==========================================================
      # 8. Install Android SDK components
      #
      # API 37 is Preview, so channel 3 is used.
      # ==========================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing Android SDK components"
          echo "=========================================="

          SDKMANAGER="$(command -v sdkmanager)"

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          echo ""
          echo "Searching for Android API 37..."

          SDK_LIST="$("$SDKMANAGER" --list --channel=3 2>&1 || true)"

          if echo "$SDK_LIST" | grep -Eq \
            'platforms;android-37([[:space:]]|$)'; then

            PLATFORM_PACKAGE="platforms;android-37"

          else

            echo "::error::platforms;android-37 was not found."

            echo ""
            echo "Available Android 37 packages:"
            echo "$SDK_LIST" | grep -i "android-37" || true

            exit 1
          fi

          echo ""
          echo "Package detected:"
          echo "$PLATFORM_PACKAGE"

          echo ""
          echo "Installing required packages..."

          "$SDKMANAGER" \
            --channel=3 \
            --install \
            "platform-tools" \
            "$PLATFORM_PACKAGE" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK installation completed."


      # ==========================================================
      # 9. Verify installed Android SDK
      # ==========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying Android SDK"
          echo "=========================================="

          PLATFORM="$ANDROID_SDK_ROOT/platforms/android-37"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          if [ ! -d "$PLATFORM" ]; then
            echo "::error::Android 37 platform was not installed."
            exit 1
          fi

          if [ ! -f "$PLATFORM/android.jar" ]; then
            echo "::error::Android 37 android.jar was not found."
            exit 1
          fi

          if [ ! -d "$BUILD_TOOLS" ]; then
            echo "::error::Build Tools 36.0.0 were not installed."
            exit 1
          fi

          echo "Android 37 platform: OK"
          echo "Build Tools 36.0.0: OK"
          echo "Platform Tools: OK"


      # ==========================================================
      # 10. Setup Gradle
      # ==========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ==========================================================
      # 11. Verify Gradle Wrapper
      # ==========================================================
      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "=========================================="
          echo "Verifying Gradle Wrapper"
          echo "=========================================="

          echo ""
          echo "Gradle distribution:"
          grep '^distributionUrl=' \
            gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Gradle version:"

          ./gradlew --version

          echo ""
          echo "Gradle Wrapper is valid."


      # ==========================================================
      # 12. Configure Supabase
      # ==========================================================
      - name: Configure Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Configuring Supabase"
          echo "=========================================="

          if [ -n "${SUPABASE_URL:-}" ] && \
             [ -n "${SUPABASE_ANON_KEY:-}" ]; then

            cat > supabase.properties <<EOF
SUPABASE_URL=${SUPABASE_URL}
SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
EOF

            chmod 600 supabase.properties

            echo "Supabase configuration created."

          else

            echo "Supabase secrets were not provided."
            echo "Continuing without supabase.properties."

          fi


      # ==========================================================
      # 13. Static project verification
      # ==========================================================
      - name: Static project verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Static project verification"
          echo "=========================================="

          KOTLIN_COUNT="$(find app/src -type f -name '*.kt' | wc -l)"

          echo "Kotlin source files: $KOTLIN_COUNT"

          if [ "$KOTLIN_COUNT" -eq 0 ]; then
            echo "::error::No Kotlin source files were found."
            exit 1
          fi

          echo ""
          echo "Static verification completed."


      # ==========================================================
      # 14. Clean project
      # ==========================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Cleaning project"
          echo "=========================================="

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace


      # ==========================================================
      # 15. Build Debug APK
      # ==========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Building Debug APK"
          echo "=========================================="

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ==========================================================
      # 16. Verify APK
      # ==========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=========================================="
          echo "Verifying APK"
          echo "=========================================="

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."

            echo ""
            echo "Available output files:"
            find app/build/outputs -type f -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK generated successfully:"
          ls -lh "$APK"


      # ==========================================================
      # 17. Run unit tests
      # ==========================================================
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Running unit tests"
          echo "=========================================="

          ./gradlew \
            :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace


      # ==========================================================
      # 18. Upload APK
      # ==========================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mrx-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
