name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # IMPORTANT:
      # No Gradle cache here because the project
      # may be inside a ZIP and the wrapper is
      # located only after project detection.
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Android SDK
      # ==========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: ''


      # ==========================================
      # 4. Accept Android SDK licenses
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Accepting Android SDK licenses"
          echo "=========================================="

          yes | sdkmanager --licenses > /tmp/sdk-licenses.log 2>&1 || true

          cat /tmp/sdk-licenses.log

          echo ""
          echo "Android SDK license step completed."


      # ==========================================
      # 5. Find Android project
      #
      # Supports:
      # - Android project directly in repository
      # - Android project inside ZIP
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Locating Android project..."
          echo "=========================================="

          if [ -f "./gradlew" ] \
            && [ -f "./settings.gradle.kts" ] \
            && [ -d "./app" ]; then

            PROJECT_DIR="$(pwd)"

            echo "Android project found directly in repository."

          else

            echo "Android project is not at repository root."
            echo "Searching for ZIP file..."

            ZIP_FILE="$(
              find . \
                -maxdepth 3 \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                | head -1
            )"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No Android project found."
              echo "No root Android project and no ZIP file were found."
              exit 1
            fi

            echo "ZIP found:"
            echo "$ZIP_FILE"

            rm -rf "$GITHUB_WORKSPACE/project"

            mkdir -p "$GITHUB_WORKSPACE/project"

            echo "Extracting ZIP..."

            unzip -q "$ZIP_FILE" \
              -d "$GITHUB_WORKSPACE/project"

            echo "Searching for gradlew..."

            GRADLEW="$(
              find "$GITHUB_WORKSPACE/project" \
                -type f \
                -name "gradlew" \
                | head -1
            )"

            if [ -z "$GRADLEW" ]; then
              echo "::error::gradlew was not found inside ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$GRADLEW")"

          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "=========================================="
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 6. Validate project structure
      # ==========================================
      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Validating Android project"
          echo "=========================================="

          test -f "./settings.gradle.kts"
          test -f "./build.gradle.kts"
          test -d "./app"
          test -f "./app/build.gradle.kts"
          test -f "./gradlew"
          test -f "./gradle/wrapper/gradle-wrapper.properties"
          test -f "./gradle/wrapper/gradle-wrapper.jar"

          chmod +x ./gradlew

          echo ""
          echo "Project structure OK."


      # ==========================================
      # 7. Verify Android configuration
      # ==========================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Android configuration"
          echo "=========================================="

          grep -nE \
            'compileSdk|targetSdk|minSdk|buildConfig' \
            app/build.gradle.kts || true

          echo ""

          if ! grep -qE \
            'compileSdk[[:space:]]*=[[:space:]]*37' \
            app/build.gradle.kts; then

            echo "::error::compileSdk = 37 was not found."
            exit 1
          fi

          if ! grep -q \
            'buildConfig = true' \
            app/build.gradle.kts; then

            echo "::error::buildConfig = true was not found."
            exit 1
          fi

          echo "Android configuration OK."


      # ==========================================
      # 8. Install Android SDK components
      # ==========================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Android SDK"
          echo "=========================================="

          echo "sdkmanager version:"
          sdkmanager --version

          echo ""
          echo "Installing required packages..."

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

          echo ""
          echo "Checking Android SDK installation..."

          if [ ! -d "${ANDROID_SDK_ROOT
