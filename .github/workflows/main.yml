name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mr.x APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JDK 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. Android SDK
      #
      # setup-android handles SDK command-line tools,
      # platform-tools and SDK licenses.
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools


      # ============================================================
      # 4. Install Android SDK packages required by Mr.x
      #
      # Project:
      # compileSdk = 37
      # targetSdk  = 37
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;36.0.0"

          echo "Android SDK packages installed successfully."


      # ============================================================
      # 5. Verify Android SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not-set}"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not-set}"


      # ============================================================
      # 6. Verify project structure
      # ============================================================
      - name: Verify Mr.x project structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Mr.x Project Verification"
          echo "========================================"

          test -f "./gradlew" || {
            echo "::error::gradlew was not found."
            exit 1
          }

          test -f "./settings.gradle.kts" || {
            echo "::error::settings.gradle.kts was not found."
            exit 1
          }

          test -f "./build.gradle.kts" || {
            echo "::error::build.gradle.kts was not found."
            exit 1
          }

          test -f "./app/build.gradle.kts" || {
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          }

          test -f "./app/src/main/AndroidManifest.xml" || {
            echo "::error::AndroidManifest.xml was not found."
            exit 1
          }

          test -f "./gradle/wrapper/gradle-wrapper.properties" || {
            echo "::error::Gradle wrapper properties were not found."
            exit 1
          }

          chmod +x ./gradlew

          echo ""
          echo "Project structure OK."


      # ============================================================
      # 7. Verify Kotlin-only project
      # ============================================================
      - name: Verify Kotlin-only source
        shell: bash
        run: |
          set -e

          echo "Searching for Java files..."

          JAVA_FILES="$(find app/src -type f -name "*.java" -print)"

          if [ -n "$JAVA_FILES" ]; then
            echo "::error::Java files were found:"
            echo "$JAVA_FILES"
            exit 1
          fi

          KOTLIN_COUNT="$(find app/src -type f -name "*.kt" | wc -l)"

          echo "Java files: 0"
          echo "Kotlin files: $KOTLIN_COUNT"

          if [ "$KOTLIN_COUNT" -eq 0 ]; then
            echo "::error::No Kotlin files were found."
            exit 1
          fi


      # ============================================================
      # 8. Verify Gradle wrapper
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Gradle wrapper version:"
          ./gradlew --version


      # ============================================================
      # 9. Verify Android configuration
      # ============================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "Android configuration detected in app/build.gradle.kts:"
          grep -E \
            'compileSdk|minSdk|targetSdk|applicationId|versionCode|versionName' \
            app/build.gradle.kts || true

          echo ""
          echo "Root Android Gradle Plugin:"
          grep -E \
            'com.android.application|com.android.library' \
            build.gradle.kts || true


      # ============================================================
      # 10. Prepare optional Supabase configuration
      # ============================================================
      - name: Prepare Supabase configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          if [ -n "$SUPABASE_URL" ] || [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then

            {
              printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
              printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            } > supabase.properties

            echo "Supabase configuration prepared."

          else

            echo "Supabase secrets are not configured."
            echo "Continuing with the project's default configuration."

          fi


      # ============================================================
      # 11. Setup Gradle
      #
      # Uses the Gradle wrapper from the repository.
      # No hard-coded Gradle version is forced here.
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6


      # ============================================================
      # 12. Verify Java / Gradle
      # ============================================================
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version


      # ============================================================
      # 13. Clean project
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 14. Build Debug APK
      # ============================================================
      - name: Build Mr.x Debug APK
        shell: bash
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 15. Run unit tests
      # ============================================================
      - name: Run Debug unit tests
        shell: bash
        run: |
          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 16. Verify APK
      # ============================================================
      - name: Verify APK was generated
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."

            echo ""
            echo "Available APK files:"
            find app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"


      # ============================================================
      # 17. Rename APK
      # ============================================================
      - name: Rename APK to Mr.x.apk
        shell: bash
        run: |
          set -e

          cp \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "Mr.x.apk"

          echo "Final APK:"
          ls -lh "Mr.x.apk"


      # ============================================================
      # 18. Verify final APK is not empty
      # ============================================================
      - name: Verify final APK
        shell: bash
        run: |
          set -e

          test -s "Mr.x.apk" || {
            echo "::error::Mr.x.apk is empty."
            exit 1
          }

          echo "Mr.x.apk is valid and non-empty."
          ls -lh "Mr.x.apk"


      # ============================================================
      # 19. Upload APK
      # ============================================================
      - name: Upload Mr.x APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr.x-debug-apk
          path: Mr.x.apk
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # 20. Build completed
      # ============================================================
      - name: Build summary
        shell: bash
        run: |
          echo "========================================"
          echo "        Mr.x BUILD SUCCESS"
          echo "========================================"
          echo ""
          echo "APK: Mr.x.apk"
          echo "Artifact: Mr.x-debug-apk"
          echo ""
          ls -lh Mr.x.apk
