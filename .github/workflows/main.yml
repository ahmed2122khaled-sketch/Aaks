name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'


      # ============================================================
      # 4. Accept Android SDK licenses
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Accepting Android SDK licenses"
          echo "=========================================="

          yes | sdkmanager --licenses > /tmp/sdk-licenses.log 2>&1 || true

          echo "Android SDK licenses processed."


      # ============================================================
      # 5. Extract Android project ZIP
      # ============================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Extracting Android project"
          echo "=========================================="

          ZIP_FILE="$GITHUB_WORKSPACE/mrx-51-final-fixed-buildable.zip"
          EXTRACT_DIR="$GITHUB_WORKSPACE/android-project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP was not found:"
            echo "$ZIP_FILE"
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo ""
          echo "Extracted files:"
          ls -la "$EXTRACT_DIR"

          echo ""
          echo "Searching for Gradle project..."

          PROJECT_DIR=""

          # --------------------------------------------------------
          # Case 1: settings file directly inside extraction folder
          # --------------------------------------------------------
          if [ -f "$EXTRACT_DIR/settings.gradle.kts" ] || \
             [ -f "$EXTRACT_DIR/settings.gradle" ]; then

            PROJECT_DIR="$EXTRACT_DIR"

          fi


          # --------------------------------------------------------
          # Case 2: project is inside one directory
          # --------------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            for DIR in "$EXTRACT_DIR"/*; do

              if [ -d "$DIR" ]; then

                if [ -f "$DIR/settings.gradle.kts" ] || \
                   [ -f "$DIR/settings.gradle" ]; then

                  PROJECT_DIR="$DIR"
                  break

                fi

              fi

            done

          fi


          # --------------------------------------------------------
          # Case 3: deeper directory
          # --------------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            FOUND_SETTINGS="$(find "$EXTRACT_DIR" \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit)"

            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$FOUND_SETTINGS")"
            fi

          fi


          # --------------------------------------------------------
          # Validate project
          # --------------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "::error::Could not find settings.gradle.kts or settings.gradle inside ZIP."

            echo ""
            echo "Extracted directory tree:"
            find "$EXTRACT_DIR" -maxdepth 5 -print

            exit 1

          fi


          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "=========================================="
          echo "Android project found"
          echo "=========================================="

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo ""

          echo "Project contents:"
          ls -la "$PROJECT_DIR"

          echo ""

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::gradlew was not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::app directory was not found."
            exit 1
          fi

          echo "Android project is valid."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 6. Validate project structure
      # ============================================================
      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Validating project structure"
          echo "=========================================="

          echo "Project directory:"
          pwd

          echo ""

          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && \
             [ ! -f "build.gradle" ]; then
            echo "::error::Root Gradle build file not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "::error::App Gradle build file not found."
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew not found."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::gradle-wrapper.jar not found."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::gradle-wrapper.properties not found."
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Project structure:"
          echo ""

          ls -la

          echo ""
          echo "App:"
          ls -la app

          echo ""
          echo "Project structure OK."


      # ============================================================
      # 7. Verify Android configuration
      # ============================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Verifying Android configuration"
          echo "=========================================="

          BUILD_FILE="app/build.gradle.kts"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "::error::$BUILD_FILE was not found."
            exit 1
          fi

          echo "Build file:"
          echo "$BUILD_FILE"

          echo ""

          echo "compileSdk:"
          grep -n "compileSdk" "$BUILD_FILE" || true

          echo ""

          echo "targetSdk:"
          grep -n "targetSdk" "$BUILD_FILE" || true

          echo ""

          if grep -Eq \
            'compileSdk[[:space:]]*=[[:space:]]*37' \
            "$BUILD_FILE"; then

            echo "OK: compileSdk = 37"

          else

            echo "::error::compileSdk = 37 was not detected."
            exit 1

          fi


          if grep -Eq \
            'targetSdk[[:space:]]*=[[:space:]]*37' \
            "$BUILD_FILE"; then

            echo "OK: targetSdk = 37"

          else

            echo "::error::targetSdk = 37 was not detected."
            exit 1

          fi


          echo ""
          echo "Android configuration OK."


      # ============================================================
      # 8. Install Android SDK components
      # ============================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Android SDK"
          echo "=========================================="

          SDKMANAGER="$(command -v sdkmanager)"

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""

          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          echo ""
          echo "=========================================="
          echo "Searching for Android API 37"
          echo "=========================================="

          SDK_LIST="$("$SDKMANAGER" --list --channel=3 2>&1 || true)"

          echo "$SDK_LIST" | grep -E \
            'platforms;android-37|platforms/android-37|build-tools;36.0.0|platform-tools' \
            || true

          PLATFORM_PACKAGE=""

          if echo "$SDK_LIST" | grep -Eq \
            'platforms;android-37([[:space:]]|$)'; then

            PLATFORM_PACKAGE="platforms;android-37"

          elif echo "$SDK_LIST" | grep -Eq \
            'platforms/android-37([[:space:]]|$)'; then

            PLATFORM_PACKAGE="platforms/android-37"

          fi

          if [ -z "$PLATFORM_PACKAGE" ]; then

            echo ""
            echo "::error::Android API 37 package was not found."

            echo ""
            echo "Available Android 37 entries:"
            echo "$SDK_LIST" | grep -i "android-37" || true

            exit 1

          fi

          echo ""
          echo "Detected package:"
          echo "$PLATFORM_PACKAGE"

          echo ""
          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            --channel=3 \
            --install \
            "platform-tools" \
            "$PLATFORM_PACKAGE" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK installation completed."


      # ============================================================
      # 9. Verify Android 37 SDK
      # ============================================================
      - name: Verify Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying Android 37 SDK"
          echo "=========================================="

          PLATFORM_DIR="$ANDROID_SDK_ROOT/platforms/android-37"

          if [ ! -d "$PLATFORM_DIR" ]; then
            echo "::error::Android 37 platform was not installed."
            exit 1
          fi

          if [ ! -f "$PLATFORM_DIR/android.jar" ]; then
            echo "::error::android.jar was not found."
            exit 1
          fi

          echo "Android 37 SDK verified successfully."


      # ============================================================
      # 10. Verify Gradle Wrapper
      # ============================================================
      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Verifying Gradle Wrapper"
          echo "=========================================="

          chmod +x gradlew

          echo ""
          echo "Gradle distribution:"
          grep '^distributionUrl=' \
            gradle/wrapper/gradle-wrapper.properties

          echo ""

          ./gradlew --version

          echo ""
          echo "Gradle Wrapper OK."


      # ============================================================
      # 11. Configure Supabase
      # ============================================================
      - name: Configure Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Configuring Supabase"
          echo "=========================================="

          if [ -n "${SUPABASE_URL:-}" ] && \
             [ -n "${SUPABASE_ANON_KEY:-}" ]; then

            cat > supabase.properties <<EOF
SUPABASE_URL=${SUPABASE_URL}
SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
EOF

            echo "Supabase configuration created."

          else

            echo "Supabase secrets are not configured."
            echo "Continuing without supabase.properties."

          fi


      # ============================================================
      # 12. Static project verification
      # ============================================================
      - name: Static project verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Static project verification"
          echo "=========================================="

          echo ""
          echo "Kotlin source files:"

          KOTLIN_COUNT="$(find app/src -type f -name '*.kt' | wc -l)"

          echo "Kotlin files: $KOTLIN_COUNT"

          if [ "$KOTLIN_COUNT" -eq 0 ]; then
            echo "::error::No Kotlin source files found."
            exit 1
          fi

          echo ""
          echo "Static verification OK."


      # ============================================================
      # 13. Clean project
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Cleaning project"
          echo "=========================================="

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 14. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Building Debug APK"
          echo "=========================================="

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ============================================================
      # 15. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Verifying APK"
          echo "=========================================="

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then

            echo "::error::APK was not generated."

            echo ""
            echo "Build outputs:"
            find app/build/outputs \
              -maxdepth 5 \
              -type f \
              -print \
              2>/dev/null || true

            exit 1

          fi

          APK_SIZE="$(stat -c%s "$APK_PATH")"

          echo ""
          echo "APK:"
          echo "$APK_PATH"

          echo ""
          echo "APK size:"
          echo "$APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 10000 ]; then
            echo "::error::APK is unexpectedly small."
            exit 1
          fi

          echo ""
          echo "APK verification OK."


      # ============================================================
      # 16. Upload APK
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: socialnetwork-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
