name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'


      # ============================================================
      # 4. Accept licenses
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Accepting Android SDK licenses"
          echo "=========================================="

          yes | sdkmanager --licenses > /tmp/sdk-licenses.log 2>&1 || true

          echo "SDK licenses accepted."


      # ============================================================
      # 5. Extract project ZIP
      # ============================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Extracting Android project"
          echo "=========================================="

          ZIP_FILE="$GITHUB_WORKSPACE/mrx-51-final-fixed-buildable.zip"
          EXTRACT_DIR="$GITHUB_WORKSPACE/extracted-project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found:"
            echo "$ZIP_FILE"
            exit 1
          fi

          rm -rf "$EXTRACT_DIR"

          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo ""
          echo "Extracted:"
          ls -la "$EXTRACT_DIR"

          echo ""
          echo "Project directory:"
          ls -la "$EXTRACT_DIR/mrx"

          if [ ! -f "$EXTRACT_DIR/mrx/settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts not found inside extracted project."
            exit 1
          fi

          if [ ! -f "$EXTRACT_DIR/mrx/build.gradle.kts" ]; then
            echo "::error::build.gradle.kts not found inside extracted project."
            exit 1
          fi

          if [ ! -d "$EXTRACT_DIR/mrx/app" ]; then
            echo "::error::app directory not found inside extracted project."
            exit 1
          fi

          if [ ! -f "$EXTRACT_DIR/mrx/gradlew" ]; then
            echo "::error::gradlew not found inside extracted project."
            exit 1
          fi

          echo "PROJECT_DIR=$EXTRACT_DIR/mrx" >> "$GITHUB_ENV"

          echo ""
          echo "Android project detected successfully."


      # ============================================================
      # 6. Validate project
      # ============================================================
      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Project validation"
          echo "=========================================="

          echo "Project:"
          pwd

          echo ""

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app
          test -f app/build.gradle.kts
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo ""
          echo "Project structure OK."


      # ============================================================
      # 7. Verify Android configuration
      # ============================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Android configuration"
          echo "=========================================="

          echo ""
          echo "compileSdk:"
          grep -n "compileSdk" app/build.gradle.kts

          echo ""
          echo "targetSdk:"
          grep -n "targetSdk" app/build.gradle.kts

          echo ""

          grep -Eq \
            'compileSdk[[:space:]]*=[[:space:]]*37' \
            app/build.gradle.kts

          grep -Eq \
            'targetSdk[[:space:]]*=[[:space:]]*37' \
            app/build.gradle.kts

          grep -Eq \
            'minSdk[[:space:]]*=[[:space:]]*21' \
            app/build.gradle.kts

          echo ""
          echo "Android configuration OK."


      # ============================================================
      # 8. Install Android SDK
      # ============================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing Android SDK components"
          echo "=========================================="

          SDKMANAGER="$(command -v sdkmanager)"

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Version:"
          "$SDKMANAGER" --version

          echo ""
          echo "Searching API 37..."

          SDK_LIST="$("$SDKMANAGER" --list --channel=3 2>&1 || true)"

          if echo "$SDK_LIST" | grep -Eq \
            'platforms;android-37([[:space:]]|$)'; then

            PLATFORM="platforms;android-37"

          else

            echo "::error::platforms;android-37 was not found."

            echo ""
            echo "Android 37 entries:"
            echo "$SDK_LIST" | grep -i "android-37" || true

            exit 1
          fi

          echo ""
          echo "Installing:"
          echo "  platform-tools"
          echo "  $PLATFORM"
          echo "  build-tools;36.0.0"

          "$SDKMANAGER" \
            --channel=3 \
            --install \
            "platform-tools" \
            "$PLATFORM" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK installation completed."


      # ============================================================
      # 9. Verify SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying Android SDK"
          echo "=========================================="

          test -d "$ANDROID_SDK_ROOT/platforms/android-37"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

          echo "Android 37 platform: OK"

          echo ""

          if [ -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ]; then
            echo "Build Tools 36.0.0: OK"
          else
            echo "::error::Build Tools 36.0.0 not found."
            exit 1
          fi

          echo ""
          echo "Android SDK verification OK."


      # ============================================================
      # 10. Setup Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ============================================================
      # 11. Verify Gradle Wrapper
      # ============================================================
      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "=========================================="
          echo "Gradle Wrapper"
          echo "=========================================="

          echo ""
          echo "Wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Gradle version:"

          ./gradlew --version


      # ============================================================
      # 12. Configure Supabase
      # ============================================================
      - name: Configure Supabase for CI
        shell: bash
        env:
          MRX_SUPABASE_URL: ${{ vars.MRX_SUPABASE_URL }}
          MRX_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MRX_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Configuring Supabase"
          echo "=========================================="

          if [ -z "${MRX_SUPABASE_URL:-}" ]; then
            echo "::warning::MRX_SUPABASE_URL is not configured."
          fi

          if [ -z "${MRX_SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::warning::MRX_SUPABASE_PUBLISHABLE_KEY is not configured."
          fi

          if [ -n "${MRX_SUPABASE_URL:-}" ] && \
             [ -n "${MRX_SUPABASE_PUBLISHABLE_KEY:-}" ]; then

            cat > supabase.properties <<EOF
SUPABASE_URL=${MRX_SUPABASE_URL}
SUPABASE_PUBLISHABLE_KEY=${MRX_SUPABASE_PUBLISHABLE_KEY}
SUPABASE_DATA_READ_URL=
SUPABASE_DATA_WRITE_URL=
SUPABASE_AUTH_URL=
SUPABASE_STORAGE_URL=
EOF

            chmod 600 supabase.properties

            echo "Supabase configuration created."

          else

            echo "Supabase configuration was not created because secrets are missing."

          fi


      # ============================================================
      # 13. Verify Supabase config if present
      # ============================================================
      - name: Verify Supabase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "supabase.properties" ] && \
             [ -f "tools/verify-supabase-config.py" ]; then

            python3 tools/verify-supabase-config.py

          else

            echo "Supabase verification skipped."

          fi


      # ============================================================
      # 14. Verify project files
      # ============================================================
      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Project verification"
          echo "=========================================="

          if [ -f "verify-project.py" ]; then
            python3 verify-project.py
          fi

          if [ -f "verify-completeness.py" ]; then
            python3 verify-completeness.py
          fi

          echo ""
          echo "Project verification completed."


      # ============================================================
      # 15. Clean
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Gradle clean"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean


      # ============================================================
      # 16. Build APK
      # ============================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Building Debug APK"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug


      # ============================================================
      # 17. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=========================================="
          echo "Verifying APK"
          echo "=========================================="

          if [ ! -f "$APK" ]; then
            echo "::error::app-debug.apk was not produced."

            echo ""
            echo "Build outputs:"
            ls -R app/build/outputs 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK found:"
          ls -lh "$APK"

          echo ""
          echo "APK verification OK."


      # ============================================================
      # 18. Unit tests
      # ============================================================
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest


      # ============================================================
      # 19. Upload APK
      # ============================================================
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mr-x-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
