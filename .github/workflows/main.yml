name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1) Download repository
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================
      # 2) Find ZIP and extract Android project
      # =========================================
      - name: Find and Extract Android Project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf project
          mkdir -p project

          echo "Extracting ZIP..."

          unzip -q "$ZIP_FILE" -d project

          echo "Searching for Gradle wrapper..."

          GRADLEW=$(find project \
            -type f \
            -name "gradlew" \
            | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside ZIP."
            echo "Extracted files:"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================
      # 3) Java 17
      # =========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================
      # 4) Android SDK
      # =========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'


      # =========================================
      # 5) Install Android SDK packages
      # =========================================
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          echo "Installing Android SDK packages..."

          sdkmanager \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK packages installed."


      # =========================================
      # 6) Fix Gradle permissions
      # =========================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version


      # =========================================
      # 7) Fix BuildConfig configuration
      # =========================================
      - name: Fix BuildConfig Configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking gradle.properties..."

          # Remove old/deprecated BuildConfig property
          # if it exists.
          find . -name "gradle.properties" -type f \
            -exec sed -i \
            '/android\.defaults\.buildfeatures\.buildconfig/d' {} \;


          echo "Searching Android module..."

          BUILD_FILE=""

          if [ -f "app/build.gradle.kts" ]; then
            BUILD_FILE="app/build.gradle.kts"
          elif [ -f "app/build.gradle" ]; then
            BUILD_FILE="app/build.gradle"
          else
            BUILD_FILE=$(find . \
              -path "*/app/build.gradle.kts" \
              -o -path "*/app/build.gradle" \
              | head -1)
          fi


          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts was not found."
            exit 1
          fi

          echo "Android build file:"
          echo "$BUILD_FILE"


          # -----------------------------------------
          # Kotlin DSL
          # -----------------------------------------
          if [[ "$BUILD_FILE" == *.kts ]]; then

            echo "Detected Kotlin Gradle file."

            python3 <<'PY'
          from pathlib import Path

          path = Path(r'''$BUILD_FILE''')
          content = path.read_text()

          if "buildConfig = true" not in content:

              marker = "android {"

              if marker in content:
                  content = content.replace(
                      marker,
                      """android {
              buildFeatures {
                  buildConfig = true
              }""",
                      1
                  )

                  path.write_text(content)
                  print("BuildConfig enabled.")
              else:
                  print("WARNING: android {} block was not found.")

          else:
              print("BuildConfig is already enabled.")
          PY

          fi


          # -----------------------------------------
          # Groovy Gradle
          # -----------------------------------------
          if [[ "$BUILD_FILE" == *.gradle ]]; then

            echo "Detected Groovy Gradle file."

            python3 <<'PY'
          from pathlib import Path

          path = Path(r'''$BUILD_FILE''')
          content = path.read_text()

          if "buildConfig true" not in content:

              marker = "android {"

              if marker in content:
                  content = content.replace(
                      marker,
                      """android {
              buildFeatures {
                  buildConfig true
              }""",
                      1
                  )

                  path.write_text(content)
                  print("BuildConfig enabled.")
              else:
                  print("WARNING: android {} block was not found.")

          else:
              print("BuildConfig is already enabled.")
          PY

          fi


          # -----------------------------------------
          # Supabase properties
          # -----------------------------------------
          if [ ! -f "supabase.properties" ]; then

            if [ -f "supabase.properties.example" ]; then
              cp supabase.properties.example supabase.properties
              echo "Created supabase.properties from example."

            else
              touch supabase.properties
              echo "Created empty supabase.properties."

            fi

          fi


          echo "Build configuration preparation finished."


      # =========================================
      # 8) Show project information
      # =========================================
      - name: Check Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================="
          echo "PROJECT DIRECTORY"
          echo "================================="

          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 2 -type f | sort | head -100

          echo ""
          echo "Gradle files:"
          find . \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print


      # =========================================
      # 9) Build Debug APK
      # =========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Starting Android build..."

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # =========================================
      # 10) Find APK
      # =========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print


      # =========================================
      # 11) Upload APK
      # =========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRX-debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
