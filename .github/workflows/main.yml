name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mr.x APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools


      # ============================================================
      # 4. Discover and install Android 17 / API 37 SDK
      #
      # We do NOT blindly assume one repository package name.
      # The runner checks the packages available from sdkmanager.
      # ============================================================
      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail

          echo "Updating Android SDK package metadata..."

          sdkmanager --update || true

          echo ""
          echo "Searching available API 37 platform packages..."

          AVAILABLE_PACKAGES="$(sdkmanager --list 2>/dev/null || true)"

          echo "$AVAILABLE_PACKAGES" \
            | grep -E 'platforms;android-37([.]0)?([[:space:]]|$)' \
            || true

          PLATFORM_PACKAGE=""

          if echo "$AVAILABLE_PACKAGES" \
              | grep -qE 'platforms;android-37([[:space:]]|$)'; then

            PLATFORM_PACKAGE="platforms;android-37"

          elif echo "$AVAILABLE_PACKAGES" \
              | grep -qE 'platforms;android-37\.0([[:space:]]|$)'; then

            PLATFORM_PACKAGE="platforms;android-37.0"

          fi

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo ""
            echo "::warning::API 37 was not found in the default SDK channel."
            echo "Trying preview/beta channel..."

            sdkmanager --channel=1 --update || true

            AVAILABLE_PACKAGES="$(sdkmanager --channel=1 --list 2>/dev/null || true)"

            if echo "$AVAILABLE_PACKAGES" \
                | grep -qE 'platforms;android-37([[:space:]]|$)'; then

              PLATFORM_PACKAGE="platforms;android-37"

            elif echo "$AVAILABLE_PACKAGES" \
                | grep -qE 'platforms;android-37\.0([[:space:]]|$)'; then

              PLATFORM_PACKAGE="platforms;android-37.0"

            fi
          fi

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo ""
            echo "::error::Android API 37 platform package could not be found."
            echo ""
            echo "Available Android platform packages:"
            echo "$AVAILABLE_PACKAGES" \
              | grep -E 'platforms;android-' \
              | head -50 \
              || true
            exit 1
          fi

          echo ""
          echo "Selected Android platform:"
          echo "$PLATFORM_PACKAGE"

          echo ""
          echo "Installing Android SDK packages..."

          sdkmanager --install \
            "$PLATFORM_PACKAGE" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK installation completed."


      # ============================================================
      # 5. Verify SDK installation
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Installed SDK packages:"
          sdkmanager --list_installed

          echo ""
          echo "Android SDK location:"
          echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-unknown}}"


      # ============================================================
      # 6. Verify project structure
      # ============================================================
      - name: Verify Mr.x project structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Mr.x Project Verification"
          echo "========================================"

          test -f "./gradlew" || {
            echo "::error::gradlew was not found."
            exit 1
          }

          test -f "./settings.gradle.kts" || {
            echo "::error::settings.gradle.kts was not found."
            exit 1
          }

          test -f "./build.gradle.kts" || {
            echo "::error::Root build.gradle.kts was not found."
            exit 1
          }

          test -f "./app/build.gradle.kts" || {
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          }

          test -f "./app/src/main/AndroidManifest.xml" || {
            echo "::error::AndroidManifest.xml was not found."
            exit 1
          }

          test -f "./gradle/wrapper/gradle-wrapper.properties" || {
            echo "::error::Gradle wrapper properties were not found."
            exit 1
          }

          chmod +x ./gradlew

          echo ""
          echo "Project structure OK."


      # ============================================================
      # 7. Verify Kotlin-only source
      # ============================================================
      - name: Verify Kotlin-only source
        shell: bash
        run: |
          set -e

          JAVA_FILES="$(find app/src -type f -name "*.java" -print)"

          if [ -n "$JAVA_FILES" ]; then
            echo "::error::Java source files were found:"
            echo "$JAVA_FILES"
            exit 1
          fi

          KOTLIN_COUNT="$(find app/src -type f -
