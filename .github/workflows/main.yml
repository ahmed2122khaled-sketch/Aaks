name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 1 - Checkout
        uses: actions/checkout@v4

      - name: 2 - Check ZIP
        run: |
          echo "Checking Android project..."

          if [ ! -f "mrx-51-final-fixed-ready.zip" ]; then
            echo "ERROR: ZIP file not found!"
            ls -lah
            exit 1
          fi

          echo "ZIP found successfully."

      - name: 3 - Extract project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q mrx-51-final-fixed-ready.zip -d project

          echo "Searching for Gradle..."
          find project -name gradlew -type f

      - name: 4 - Find Android project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: 5 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 6 - Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: 7 - Prepare project
        run: |
          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Preparing Gradle..."

          if [ ! -f supabase.properties ]; then
            if [ -f supabase.properties.example ]; then
              cp supabase.properties.example supabase.properties
            else
              touch supabase.properties
            fi
          fi

          if [ -f gradle.properties ]; then
            sed -i '/^android\.defaults\.buildfeatures\.buildconfig=/d' gradle.properties
          fi

      - name: 8 - Test Gradle
        run: |
          cd "$PROJECT_DIR"

          echo "Testing Gradle configuration..."

          ./gradlew tasks --no-daemon --stacktrace

      - name: 9 - Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "================================"
          echo "BUILDING APK"
          echo "================================"

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: 10 - Find APK
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

      - name: 11 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRX-debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
