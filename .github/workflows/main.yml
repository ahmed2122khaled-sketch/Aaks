name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android ZIP file found."
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          
          GRADLEW=$(find project -type f -name "gradlew" | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK and Accept Licenses
        shell: bash
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools

          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Fix Android build configuration
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          
          # حذف أي خاصية قديمة قد تسبب تعارضاً
          find . -name "gradle.properties" -type f -print0 | while IFS= read -r -d '' file
          do
            sed -i '/^[[:space:]]*android\.defaults\.buildfeatures\.buildconfig[[:space:]]*=/d' "$file"
          done

      - name: Enable BuildConfig
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          APP_GRADLE=$(find . -path "*/app/build.gradle.kts" -type f | head -1)
          if [ -z "$APP_GRADLE" ]; then
            APP_GRADLE=$(find . -path "*/app/build.gradle" -type f | head -1)
          fi
          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          if "buildConfig = true" in text:
              print("BuildConfig is already enabled.")
              raise SystemExit(0)
          marker = "android {"
          if marker not in text:
              print("ERROR: android { block was not found.")
              raise SystemExit(1)
          replacement = """android {
              buildFeatures {
                  buildConfig = true
              }
          """
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          print("BuildConfig enabled successfully.")
          PY

      - name: Prepare Supabase properties
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f supabase.properties ]; then
            if [ -f supabase.properties.example ]; then
              cp supabase.properties.example supabase.properties
            else
              touch supabase.properties
            fi
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRX-debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
