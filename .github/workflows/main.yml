name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1) تحميل المستودع
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2) فك مشروع Android من ZIP
      # ============================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p project

          unzip -q mrx-51-final-fixed-ready.zip -d project

          echo "========================================"
          echo "Extracted project files"
          echo "========================================"

          find project -maxdepth 4 -type f | head -150

          GRADLEW=$(find project -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROJECT_DIR = $PROJECT_DIR"
          echo "========================================"


      # ============================================================
      # 3) Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 4) Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 5) تثبيت SDK المطلوبة
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK setup completed."


      # ============================================================
      # 6) إصلاح مشروع Android قبل البناء
      #
      # مهم جداً:
      # لا نستخدم:
      # android.defaults.buildfeatures.buildconfig=true
      #
      # لأن AGP 9 أزال هذه الخاصية القديمة.
      # ============================================================
      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "========================================"
          echo "Gradle version"
          echo "========================================"

          ./gradlew --version


          # --------------------------------------------------------
          # حذف الخاصية القديمة لو كانت موجودة
          # --------------------------------------------------------
          if [ -f gradle.properties ]; then

            sed -i \
              '/^[[:space:]]*android\.defaults\.buildfeatures\.buildconfig[[:space:]]*=/d' \
              gradle.properties

            sed -i \
              '/^[[:space:]]*android\.defaults\.buildfeatures\.aidl[[:space:]]*=/d' \
              gradle.properties

            sed -i \
              '/^[[:space:]]*android\.defaults\.buildfeatures\.renderscript[[:space:]]*=/d' \
              gradle.properties

          else
            touch gradle.properties
          fi


          # --------------------------------------------------------
          # Supabase properties
          # --------------------------------------------------------
          if [ ! -f supabase.properties ]; then

            if [ -f supabase.properties.example ]; then
              cp supabase.properties.example supabase.properties
            else
              touch supabase.properties
            fi

          fi


          # --------------------------------------------------------
          # إظهار محتوى gradle.properties للتأكد
          # --------------------------------------------------------
          echo "========================================"
          echo "gradle.properties"
          echo "========================================"

          cat gradle.properties || true


          # --------------------------------------------------------
          # تفعيل BuildConfig داخل app module بالطريقة الصحيحة
          # --------------------------------------------------------
          APP_GRADLE="app/build.gradle"

          if [ -f "$APP_GRADLE" ]; then

            echo "========================================"
            echo "Found app/build.gradle"
            echo "========================================"

            python3 - "$APP_GRADLE" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])
text = path.read_text()

# إذا كان buildConfig موجوداً بالفعل لا نضيفه مرة ثانية.
if "buildFeatures" in text and "buildConfig" in text:
    print("BuildConfig configuration already exists.")
    raise SystemExit(0)

# نبحث عن android {
marker = "android {"

if marker not in text:
    print("WARNING: android { block not found.")
    print("BuildConfig was not automatically inserted.")
    raise SystemExit(0)

insert = """android {
    buildFeatures {
        buildConfig = true
    }
"""

text = text.replace(marker, insert, 1)

path.write_text(text)

print("BuildConfig enabled inside app/build.gradle")
PY

          elif [ -f "app/build.gradle.kts" ]; then

            echo "========================================"
            echo "Found app/build.gradle.kts"
            echo "========================================"

            python3 - "app/build.gradle.kts" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])
text = path.read_text()

if "buildFeatures" in text and "buildConfig" in text:
    print("BuildConfig configuration already exists.")
    raise SystemExit(0)

marker = "android {"

if marker not in text:
    print("WARNING: android { block not found.")
    raise SystemExit(0)

insert = """android {
    buildFeatures {
        buildConfig = true
    }
"""

text = text.replace(marker, insert, 1)

path.write_text(text)

print("BuildConfig enabled inside app/build.gradle.kts")
PY

          else

            echo "ERROR: app/build.gradle or app/build.gradle.kts was not found."
            exit 1

          fi


          # --------------------------------------------------------
          # عرض أول جزء من build.gradle للتأكد
          # --------------------------------------------------------
          echo "========================================"
          echo "APP BUILD FILE"
          echo "========================================"

          if [ -f app/build.gradle ]; then
            sed -n '1,100p' app/build.gradle
          else
            sed -n '1,100p' app/build.gradle.kts
          fi


      # ============================================================
      # 7) فحص Gradle بدون بناء APK
      # ============================================================
      - name: Validate Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew :app:tasks \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 8) بناء Debug APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 9) البحث عن APK
      # ============================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Generated APK files"
          echo "========================================"

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi


      # ============================================================
      # 10) رفع APK كـ Artifact
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRX-debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
