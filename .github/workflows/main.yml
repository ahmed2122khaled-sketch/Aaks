name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q mrx-51-final-fixed-ready.zip -d project
          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100
          
          GRADLEW=$(find project -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bypass Android SDK Licenses
        run: |
          mkdir -p $HOME/.android
          echo "24333f8a43b681623ec8ab64f699049449f3956e" > $HOME/.android/repositories.cfg
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "e4805e7e8ebca9955722b528659d43501a1158b5" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Prepare project
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          if [ ! -f supabase.properties ]; then
            if [ -f supabase.properties.example ]; then
              cp supabase.properties.example supabase.properties
            else
              touch supabase.properties
            fi
          fi

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRX-debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
