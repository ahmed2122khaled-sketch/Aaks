name: Mr.x Project Doctor

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  doctor:
    name: Diagnose Mr.x Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Run Project Diagnostics
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -u
          
          REPORT="$GITHUB_STEP_SUMMARY"
          
          echo "# 🔍 Mr.x Project Doctor" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "Automatic project/environment diagnosis." >> "$REPORT"
          echo "" >> "$REPORT"
          
          FAIL=0

          # 1. Project files
          echo "## 1. Project files" >> "$REPORT"
          for f in "./gradlew" "./settings.gradle.kts" "./build.gradle.kts" "./app/build.gradle.kts" "./app/src/main/AndroidManifest.xml" "./gradle/wrapper/gradle-wrapper.properties"; do
            if [ -f "$f" ]; then
              echo "- ✅ \`$f\`" >> "$REPORT"
            else
              echo "- ❌ \`$f\` - missing" >> "$REPORT"
              FAIL=1
            fi
          done
          echo "" >> "$REPORT"

          # 2. Source Files
          echo "## 2. Source Files" >> "$REPORT"
          JAVA_COUNT=$(find app/src -type f -name "*.java" 2>/dev/null | wc -l | tr -d ' ')
          KT_COUNT=$(find app/src -type f -name "*.kt" 2>/dev/null | wc -l | tr -d ' ')
          echo "- Java files: $JAVA_COUNT" >> "$REPORT"
          echo "- Kotlin files: $KT_COUNT" >> "$REPORT"
          if [ "$JAVA_COUNT" -eq 0 ]; then
            echo "  - ✅ No Java source files found." >> "$REPORT"
          else
            echo "  - ⚠️ Java source files still exist." >> "$REPORT"
          fi
          echo "" >> "$REPORT"

          # 3. Android SDK requirements
          echo "## 3. Android SDK requirements" >> "$REPORT"
          compile_sdk=$(grep -Eo 'compileSdk[[:space:]]*=[[:space:]]*[0-9]+|compileSdk[[:space:]]+[0-9]+' app/build.gradle.kts 2>/dev/null | grep -Eo '[0-9]+' | tail -1 || true)
          min_sdk=$(grep -Eo 'minSdk[[:space:]]*=[[:space:]]*[0-9]+|minSdk[[:space:]]+[0-9]+' app/build.gradle.kts 2>/dev/null | grep -Eo '[0-9]+' | tail -1 || true)
          target_sdk=$(grep -Eo 'targetSdk[[:space:]]*=[[:space:]]*[0-9]+|targetSdk[[:space:]]+[0-9]+' app/build.gradle.kts 2>/dev/null | grep -Eo '[0-9]+' | tail -1 || true)
          
          echo "- \`compileSdk\`: ${compile_sdk:-Not detected}" >> "$REPORT"
          echo "- \`minSdk\`: ${min_sdk:-Not detected}" >> "$REPORT"
          echo "- \`targetSdk\`: ${target_sdk:-Not detected}" >> "$REPORT"
          
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$compile_sdk" ]; then
            found_platform=0
            for platform_dir in "$SDK_ROOT/platforms/android-$compile_sdk" "$SDK_ROOT/platforms/android-${compile_sdk}.0"; do
              if [ -d "$platform_dir" ]; then
                echo "  - ✅ Found: $(basename "$platform_dir")" >> "$REPORT"
                found_platform=1
              fi
            done
            if [ "$found_platform" -eq 0 ]; then
              echo "  - ❌ Android SDK Platform for compileSdk $compile_sdk is not installed." >> "$REPORT"
              FAIL=1
            fi
          else
            echo "  - ⚠️ Could not automatically detect compileSdk." >> "$REPORT"
          fi
          echo "" >> "$REPORT"

          # 4. Java / Gradle
          echo "## 4. Java / Gradle" >> "$REPORT"
          echo '```text' >> "$REPORT"
          java -version 2>&1 | head -3 >> "$REPORT"
          echo '```' >> "$REPORT"
          chmod +x ./gradlew || true
          if [ -x "./gradlew" ]; then
            echo '```text' >> "$REPORT"
            ./gradlew --version 2>&1 | head -25 >> "$REPORT" || true
            echo '```' >> "$REPORT"
          fi
          echo "" >> "$REPORT"

          # 5. Android Gradle Plugin / Kotlin configuration
          echo "## 5. Android Gradle Plugin / Kotlin configuration" >> "$REPORT"
          echo '```text' >> "$REPORT"
          grep -RniE '(com\.android\.application|com\.android\.library|org\.jetbrains\.kotlin|android\{)' settings.gradle.kts build.gradle.kts app/build.gradle.kts 2>/dev/null | head -50 || true
          echo '```' >> "$REPORT"
          echo "" >> "$REPORT"

          # 6. Explicit build tools requirement
          echo "## 6. Explicit build tools requirement" >> "$REPORT"
          build_tools=$(grep -Eo 'buildToolsVersion[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts 2>/dev/null | grep -Eo '[0-9.]+' | tail -1 || true)
          if [ -n "$build_tools" ]; then
            echo "- Explicit setting found: \`$build_tools\`" >> "$REPORT"
          else
            echo "- ℹ️ No explicit buildToolsVersion found; AGP can select its compatible default." >> "$REPORT"
          fi
          echo "" >> "$REPORT"

          # 7. Gradle configuration test
          echo "## 7. Gradle configuration test" >> "$REPORT"
          if [ -x "./gradlew" ]; then
            if ./gradlew help --no-daemon --stacktrace > /tmp/mrX-gradle-doctor.log 2>&1; then
              echo "- ✅ Gradle project configuration succeeded." >> "$REPORT"
            else
              echo "- ❌ Gradle project configuration failed." >> "$REPORT"
              echo '```text' >> "$REPORT"
              tail -40 /tmp/mrX-gradle-doctor.log || true
              echo '```' >> "$REPORT"
              FAIL=1
            fi
          else
            echo "- ❌ gradlew is missing or not executable." >> "$REPORT"
            FAIL=1
          fi
          echo "" >> "$REPORT"

          # 8. Dependency resolution test
          echo "## 8. Dependency resolution test" >> "$REPORT"
          if [ -x "./gradlew" ]; then
            if ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > /tmp/mrX-dependencies.log 2>&1; then
              echo "- ✅ Debug dependencies resolved successfully." >> "$Report"
            else
              echo "- ❌ Dependency resolution failed." >> "$REPORT"
              echo '```text' >> "$REPORT"
              tail -50 /tmp/mrX-dependencies.log || true
              echo '```' >> "$REPORT"
              FAIL=1
            fi
          fi
          echo "" >> "$REPORT"

          # 9. GitHub Secrets
          echo "## 9. GitHub Secrets" >> "$REPORT"
          if [ -n "${SUPABASE_URL:-}" ]; then
            echo "- ✅ SUPABASE_URL is available to this job." >> "$REPORT"
          else
            echo "- ⚠️ SUPABASE_URL is not configured for this workflow." >> "$REPORT"
          fi
          if [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "- ✅ SUPABASE_PUBLISHABLE_KEY is available to this job." >> "$REPORT"
          else
            echo "- ⚠️ SUPABASE_PUBLISHABLE_KEY is not configured for this workflow." >> "$REPORT"
          fi
          echo "" >> "$REPORT"

          # 10. Final Diagnosis
          echo "## 10. Final Diagnosis" >> "$REPORT"
          if [ "$FAIL" -eq 0 ]; then
            echo "### ✅ No blocking environment/project errors detected." >> "$REPORT"
            echo "The project passed the available static, SDK, Gradle configuration, and dependency checks." >> "$REPORT"
          else
            echo "### ❌ Blocking problems detected." >> "$REPORT"
            echo "Review the failed checks above before running the APK build." >> "$REPORT"
            exit 1
          fi
