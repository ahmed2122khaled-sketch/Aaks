name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Mr.x APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Verify Project Structure & Doctor Checks
        run: |
          ./tools/doctor.sh || true

      - name: Prepare Supabase Properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "SUPABASE_URL=$SUPABASE_URL" > supabase.properties
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" >> supabase.properties
            echo "Supabase properties created successfully."
          else
            echo "Warning: Supabase secrets are missing, checking template..."
            if [ -f "supabase.properties.example" ]; then
              cp supabase.properties.example supabase.properties
            fi
          fi

      - name: Clean and Build Debug APK
        run: ./gradlew clean :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mr.x-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
