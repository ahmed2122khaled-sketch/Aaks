name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mr.x APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install Android SDK Platform 37
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Android SDK Platform 37..."

          yes | sdkmanager --licenses >/dev/null || true

          # تم تصحيح صيغة المنصة لتكون متوافقة مع sdkmanager
          sdkmanager "platforms;android-37"

          echo "Android SDK Platform 37 installed successfully."

          sdkmanager --list_installed | grep "platforms;android-37" || true

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --list_installed

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          test -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/platforms/android-37"

      - name: Verify Mr.x project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f "./gradlew"
          test -f "./settings.gradle.kts"
          test -f "./build.gradle.kts"
          test -f "./app/build.gradle.kts"
          test -f "./app/src/main/AndroidManifest.xml"
          test -f "./gradle/wrapper/gradle-wrapper.properties"

          chmod +x ./gradlew

      - name: Verify Kotlin-only source
        shell: bash
        run: |
          set -euo pipefail

          JAVA_FILES="$(find app/src -type f -name "*.java" -print)"

          if [ -n "$JAVA_FILES" ]; then
            echo "::error::Java source files were found:"
            echo "$JAVA_FILES"
            exit 1
          fi

          KOTLIN_COUNT="$(find app/src -type f -name "*.kt" | wc -l)"

          echo "Java source files: 0"
          echo "Kotlin source files: $KOTLIN_COUNT"

          if [ "$KOTLIN_COUNT" -eq 0 ]; then
            echo "::error::No Kotlin source files were found."
            exit 1
          fi

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cat gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Android configuration:"
          grep -E 'compileSdk|minSdk|targetSdk|applicationId|versionCode|versionName' app/build.gradle.kts || true

          echo "Android Gradle Plugin configuration:"
          grep -E 'com.android.application|com.android.library' build.gradle.kts || true

      - name: Prepare Supabase configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${SUPABASE_URL:-}" ] || [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            {
              printf 'SUPABASE_URL=%s\n' "${SUPABASE_URL:-}"
              printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "${SUPABASE_PUBLISHABLE_KEY:-}"
            } > supabase.properties

            echo "Supabase configuration file prepared."
          else
            echo "Supabase GitHub Secrets are not configured."
            echo "Continuing with the project's existing configuration."
          fi

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          java -version
          ./gradlew --version

      - name: Clean project
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build Mr.x Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Run Debug unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Verify APK was generated
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            echo "Available APK files:"
            find app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Rename APK to Mr.x.apk
        shell: bash
        run: |
          set -euo pipefail
          cp "app/build/outputs/apk/debug/app-debug.apk" "Mr.x.apk"

      - name: Validate final APK
        shell: bash
        run: |
          set -euo pipefail

          test -s "Mr.x.apk"
          file "Mr.x.apk"
          ls -lh "Mr.x.apk"

      - name: Upload Mr.x APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr.x-debug-apk
          path: Mr.x.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          echo "========================================"
          echo "Mr.x BUILD SUCCESS"
          echo "========================================"
          ls -lh Mr.x.apk
