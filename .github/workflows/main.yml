name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mr.x APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install required Android SDK packages
        run: |
          sdkmanager             "platform-tools"             "platforms;android-37"

      - name: Verify Android project structure
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          test -f "./gradlew" || {
            echo "::error::gradlew was not found in the repository root."
            exit 1
          }

          test -f "./settings.gradle.kts" || {
            echo "::error::settings.gradle.kts was not found in the repository root."
            exit 1
          }

          test -f "./app/build.gradle.kts" || {
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          }

          test -f "./app/src/main/AndroidManifest.xml" || {
            echo "::error::AndroidManifest.xml was not found."
            exit 1
          }

          if find . -type f -name "*.java" -not -path "./.git/*" | grep -q .; then
            echo "::error::Java source files were found. This project is expected to be Kotlin-only."
            find . -type f -name "*.java" -not -path "./.git/*"
            exit 1
          fi

          chmod +x ./gradlew

          echo "Project structure OK."
          echo "Java source files: 0"

      - name: Prepare Supabase configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          if [ -n "$SUPABASE_URL" ] || [ -n "$SUPABASE_ANON_KEY" ] || [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            {
              echo "supabase.url=$SUPABASE_URL"
              echo "supabase.anonKey=$SUPABASE_ANON_KEY"
              echo "supabase.publishableKey=$SUPABASE_PUBLISHABLE_KEY"
            } > supabase.properties

            echo "Supabase configuration file prepared."
          else
            echo "Supabase secrets were not provided."
            echo "Continuing without creating supabase.properties."
          fi

      - name: Show Gradle and Java versions
        run: |
          java -version
          ./gradlew --version

      - name: Clean previous build
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK was generated
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated at $APK"
            echo "Available APK files:"
            find app/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Rename APK to Mr.x.apk
        shell: bash
        run: |
          cp "app/build/outputs/apk/debug/app-debug.apk" "Mr.x.apk"
          ls -lh "Mr.x.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mr.x-debug-apk
          path: Mr.x.apk
          if-no-files-found: error
          retention-days: 14
