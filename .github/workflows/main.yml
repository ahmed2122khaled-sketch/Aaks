name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: ''


      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses > /tmp/sdk-licenses.log 2>&1 || true

          cat /tmp/sdk-licenses.log

          echo "SDK license step completed."


      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ] \
            && [ -f "./settings.gradle.kts" ] \
            && [ -d "./app" ]; then

            PROJECT_DIR="$(pwd)"

            echo "Android project found at repository root."

          else

            ZIP_FILE="$(
              find . \
                -maxdepth 3 \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                | head -1
            )"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No Android project found."
              exit 1
            fi

            echo "ZIP found: $ZIP_FILE"

            rm -rf "$GITHUB_WORKSPACE/project"
            mkdir -p "$GITHUB_WORKSPACE/project"

            unzip -q "$ZIP_FILE" \
              -d "$GITHUB_WORKSPACE/project"

            GRADLEW="$(
              find "$GITHUB_WORKSPACE/project" \
                -type f \
                -name "gradlew" \
                | head -1
            )"

            if [ -z "$GRADLEW" ]; then
              echo "::error::gradlew was not found inside ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$GRADLEW")"

          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "PROJECT_DIR"
          echo "$PROJECT_DIR"
          echo "=========================================="


      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f "./settings.gradle.kts"
          test -f "./build.gradle.kts"
          test -d "./app"
          test -f "./app/build.gradle.kts"
          test -f "./gradlew"
          test -f "./gradle/wrapper/gradle-wrapper.properties"
          test -f "./gradle/wrapper/gradle-wrapper.jar"

          chmod +x ./gradlew

          echo "Project structure OK."


      - name: Configure Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Android configuration:"

          grep -nE \
            'compileSdk|targetSdk|minSdk|buildConfig' \
            app/build.gradle.kts

          if ! grep -qE \
            'compileSdk[[:space:]]*=[[:space:]]*37' \
            app/build.gradle.kts; then

            echo "::error::compileSdk = 37 was not found."
            exit 1
          fi

          if ! grep -q \
            'buildConfig = true' \
            app/build.gradle.kts; then

            echo "::error::buildConfig = true was not found."
            exit 1
          fi


      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing required Android SDK packages..."

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

          echo "Checking installed SDK..."

          test -d "${ANDROID_SDK_ROOT}/platforms/android-37"
          test -d "${ANDROID_SDK_ROOT}/build-tools/36.0.0"

          echo "Android SDK is ready."


      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          EXPECTED_SHA="7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d"

          ACTUAL_SHA="$(
            sha256sum gradle/wrapper/gradle-wrapper.jar \
            | awk '{print tolower($1)}'
          )"

          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Gradle Wrapper JAR checksum mismatch."
            exit 1
          fi

          ./gradlew --version


      - name: Configure Supabase
        shell: bash
        env:
          MRX_SUPABASE_URL: ${{ vars.MRX_SUPABASE_URL }}
          MRX_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MRX_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -n "${MRX_SUPABASE_URL:-}" ] \
            && [ -n "${MRX_SUPABASE_PUBLISHABLE_KEY:-}" ]; then

            cat > supabase.properties <<EOF
          SUPABASE_URL=${MRX_SUPABASE_URL}
          SUPABASE_PUBLISHABLE_KEY=${MRX_SUPABASE_PUBLISHABLE_KEY}
          SUPABASE_DATA_READ_URL=
          SUPABASE_DATA_WRITE_URL=
          SUPABASE_AUTH_URL=
          SUPABASE_STORAGE_URL=
          EOF

            chmod 600 supabase.properties

            echo "Supabase configuration loaded."

          else

            echo "Supabase variables/secrets are not configured."

            touch supabase.properties

          fi


      - name: Static project verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f verify-project.py ]; then
            python3 verify-project.py
          fi

          if [ -f verify-completeness.py ]; then
            python3 verify-completeness.py
          fi


      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace


      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."

            find app/build/outputs \
              -type f \
              -print || true

            exit 1
          fi

          echo "=========================================="
          echo "APK CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-x-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
